<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rick and Morty Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Rick and Morty <span>Explorer</span></h1>
    <nav class="tabs" role="tablist">
      <button id="tab-all" class="tab active" role="tab" aria-selected="true">Personajes</button>
      <button id="tab-fav" class="tab" role="tab" aria-selected="false">Favoritos <span id="fav-count" class="badge">0</span></button>
    </nav>
  </header>

  <main>
    <section class="controls" aria-label="Búsqueda y filtros">
      <input id="search" type="search" placeholder="Buscar por nombre…" aria-label="Buscar personaje">
      <select id="filter-status" aria-label="Estado">
        <option value="">Todos los estados</option>
        <option value="alive">Vivo</option>
        <option value="dead">Muerto</option>
        <option value="unknown">Desconocido</option>
      </select>
      <select id="filter-gender" aria-label="Género">
        <option value="">Todos los géneros</option>
        <option value="female">Femenino</option>
        <option value="male">Masculino</option>
        <option value="genderless">Sin género</option>
        <option value="unknown">Desconocido</option>
      </select>
      <select id="filter-species" aria-label="Especie">
        <option value="">Todas las especies</option>
        <option>Human</option>
        <option>Alien</option>
        <option>Humanoid</option>
        <option>Robot</option>
        <option>Animal</option>
        <option>Mythological Creature</option>
        <option>Disease</option>
        <option>Poopybutthole</option>
        <option>Cronenberg</option>
      </select>
      <select id="sort" aria-label="Ordenar">
        <option value="">Orden original</option>
        <option value="az">Nombre A–Z</option>
        <option value="za">Nombre Z–A</option>
      </select>
      <button id="reset" type="button">Limpiar</button>
    </section>

    <p id="message" class="message" role="status" hidden></p>
    <div id="loader" class="loader" hidden>Cargando…</div>
    <section id="grid" class="grid" aria-live="polite"></section>

    <nav id="pager" class="pager">
      <button id="prev" type="button">← Anterior</button>
      <span id="page-info"></span>
      <button id="next" type="button">Siguiente →</button>
    </nav>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button id="modal-close" class="modal-close" aria-label="Cerrar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>Datos de <a href="https://rickandmortyapi.com" target="_blank" rel="noopener">rickandmortyapi.com</a></footer>
  <script src="script.js"></script>
</body>
</html>
